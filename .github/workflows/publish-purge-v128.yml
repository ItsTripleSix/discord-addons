name: Publish Purge Tools v1.2.8 stable

on:
  push:
    paths:
      - .github/workflows/publish-purge-v128.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable
        uses: actions/checkout@v4

      - name: Verify stable baseline
        run: |
          test "$(git hash-object plugins/purge-tools/index.js)" = "3fc64ece4c836765f0c93299088ab410923f06d1"
          grep -q 'const PLUGIN_VERSION = "1.1.1";' plugins/purge-tools/index.js

      - name: Fetch validated v1.2.8 release candidate
        run: |
          curl -fsSL https://raw.githubusercontent.com/ItsTripleSix/discord-addons-staging/main/plugins/purge-tools/index.js -o /tmp/staging.js
          test "$(git hash-object /tmp/staging.js)" = "21a209cc299ecd9ed7846a2ea13ae3f030206dfb"
          grep -q 'const PLUGIN_VERSION = "1.2.8-shiggy";' /tmp/staging.js

      - name: Build stable source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/staging.js')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ('  const V = vendetta;', '  const V = globalThis.vendetta;', 'vendetta binding'),
              ('  const PLUGIN_VERSION = "1.2.8-shiggy";', '  const PLUGIN_VERSION = "1.2.8";', 'stable version'),
          ]
          for before, after, label in pairs:
              n = s.count(before)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(before, after, 1)
          Path('/tmp/stable.js').write_text(s, encoding='utf-8')
          PY
          node --check /tmp/stable.js
          grep -q 'const PLUGIN_VERSION = "1.2.8";' /tmp/stable.js
          grep -q 'const TRANSIENT_RETRIES = 2;' /tmp/stable.js
          grep -q 'transient_errors:' /tmp/stable.js
          grep -q 'unresolved_failures:' /tmp/stable.js
          grep -q 'shared_hard_cap_per_min: 30' /tmp/stable.js
          grep -q 'report_version: 3' /tmp/stable.js
          ! grep -q 'shiggyPurgeWrapperBase' /tmp/stable.js

      - name: Install stable source and manifest
        run: |
          cp /tmp/stable.js plugins/purge-tools/index.js
          HASH="$(git hash-object plugins/purge-tools/index.js)"
          export HASH
          python3 - <<'PY'
          import json, os
          path = 'plugins/purge-tools/manifest.json'
          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['description'] = "Purge Tools v1.2.8 with adaptive shared pacing, transient 5xx retries and recovered/unresolved failure accounting, reusable previews, message/reaction cleanup, verification, media protection, and persistent resume checkpoints."
          data['hash'] = os.environ['HASH']
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY
          test "$(python3 -c 'import json; print(json.load(open("plugins/purge-tools/manifest.json"))["hash"])')" = "$HASH"
          node --check plugins/purge-tools/index.js

      - name: Commit stable v1.2.8
        run: |
          git config user.name "ItsTripleSix"
          git config user.email "onlytriplesix@protonmail.com"
          git add plugins/purge-tools/index.js plugins/purge-tools/manifest.json
          git diff --cached --check
          git commit -m "Release Purge Tools v1.2.8"
          git push origin HEAD:main
